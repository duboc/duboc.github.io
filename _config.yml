title: Anderson Duboc
description: Thinking out loud about software, AI, and the people who build it.
description_pt: Pensando em voz alta sobre software, IA e as pessoas que constroem.
author: Anderson Duboc
url: https://duboc.github.io
baseurl: ""
lang: en
timezone: America/Sao_Paulo
github_username: duboc

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  # jekyll-feed writes the posts feed to feed.path and collection feeds to
  # /feed/<name>.xml by default. This blog has no posts, so the essays feed
  # takes /feed.xml and the (empty) posts feed moves out of the way.
  path: /feed/posts.xml
  posts_limit: 50
  collections:
    essays:
      path: /feed.xml

collections:
  essays:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - docs
  - scripts
  - tests
  - Justfile
  - AGENTS.md
  - README.md
  - pyproject.toml
  - uv.lock
