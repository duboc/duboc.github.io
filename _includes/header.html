<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <div class="lang-toggle" role="group" aria-label="Language / Idioma">
    <button type="button" data-set-lang="en" aria-pressed="false" onclick="setLang('en')">EN</button>
    <button type="button" data-set-lang="pt-BR" aria-pressed="false" onclick="setLang('pt-BR')">PT</button>
  </div>
</header>
